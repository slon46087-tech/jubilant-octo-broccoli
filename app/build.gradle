plugins {
    id 'com.android.application'
}

android {
    namespace 'Com.Mint.Standoff2'
    compileSdk 35

    defaultConfig {
        applicationId 'Com.Mint.Standoff2'
        minSdk 23
        targetSdk 35
        versionCode 392
        versionName '0.39.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

def prepareCustomIcon = tasks.register('prepareCustomIcon') {
    doLast {
        File sourceIcon = rootProject.file('Icon/icon.png')
        if (!sourceIcon.exists()) {
            throw new GradleException('Icon/icon.png not found')
        }

        def source = javax.imageio.ImageIO.read(sourceIcon)
        if (source == null) {
            throw new GradleException('Icon/icon.png is not a valid PNG image')
        }

        int size = 512
        def rounded = new java.awt.image.BufferedImage(
                size,
                size,
                java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def graphics = rounded.createGraphics()
        graphics.setRenderingHint(
                java.awt.RenderingHints.KEY_ANTIALIASING,
                java.awt.RenderingHints.VALUE_ANTIALIAS_ON
        )
        graphics.setRenderingHint(
                java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC
        )
        graphics.setRenderingHint(
                java.awt.RenderingHints.KEY_RENDERING,
                java.awt.RenderingHints.VALUE_RENDER_QUALITY
        )

        float scale = Math.max(
                size / (float) source.getWidth(),
                size / (float) source.getHeight()
        )
        int drawWidth = Math.round(source.getWidth() * scale)
        int drawHeight = Math.round(source.getHeight() * scale)
        int drawX = (size - drawWidth) / 2
        int drawY = (size - drawHeight) / 2
        graphics.drawImage(source, drawX, drawY, drawWidth, drawHeight, null)

        graphics.setComposite(java.awt.AlphaComposite.DstIn)
        graphics.setColor(java.awt.Color.WHITE)
        float arc = size * 0.24f
        graphics.fill(new java.awt.geom.RoundRectangle2D.Float(
                0f,
                0f,
                size,
                size,
                arc,
                arc
        ))
        graphics.dispose()

        File drawableDir = file('src/main/res/drawable-nodpi')
        drawableDir.mkdirs()
        File targetIcon = new File(drawableDir, 'app_icon.png')
        if (!javax.imageio.ImageIO.write(rounded, 'png', targetIcon)) {
            throw new GradleException('Failed to create rounded application icon')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn prepareCustomIcon
}
